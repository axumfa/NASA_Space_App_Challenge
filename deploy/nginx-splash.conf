# Optional: paint a splash before Streamlit's JavaScript has loaded (the app itself shows the same splash once it connects).
# Streamlit's HTML shell is `<div id="root"></div>`; React replaces that element when it mounts, so the splash removes itself.
# Include inside the `location /` block that proxies to Streamlit:   include /home/ubuntu/fieldshift/deploy/nginx-splash.conf;
proxy_set_header Accept-Encoding "";        # let nginx see the HTML to rewrite it (nginx gzips the response itself)
sub_filter_once on;
sub_filter '<div id="root"></div>' '<div id="root"><style>.fs-pre{position:fixed;top:0;right:0;bottom:0;left:0;background:#FAF8F3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Inter,-apple-system,Arial,sans-serif;color:#232623}.fs-pre b{font-size:1.25rem;letter-spacing:-.02em}.fs-pre span{font-size:.85rem;color:#6B6F66}.fs-pre i{display:block;width:150px;height:4px;border-radius:3px;background:#E3DFD3;overflow:hidden;position:relative}.fs-pre i:after{content:"";position:absolute;top:0;bottom:0;width:45%;background:#2F6B45;border-radius:3px;animation:fsp 1.2s ease-in-out infinite}@keyframes fsp{0%{left:-45%}100%{left:100%}}</style><div class="fs-pre"><svg viewBox="0 0 32 32" width="40" height="40"><rect width="32" height="32" rx="8" fill="#2F6B45"/><path d="M6 12.5L26 7.5" stroke="#CFE0C8" stroke-width="3" stroke-linecap="round"/><path d="M6 19L26 14" stroke="#EAF1E4" stroke-width="3" stroke-linecap="round"/><path d="M6 25.5L26 20.5" stroke="#B9C48A" stroke-width="3" stroke-linecap="round"/></svg><b>Field Shift</b><span>Loading&#8230;</span><i></i></div></div>';
